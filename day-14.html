<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Efficient Fake E-Commerce API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #products {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status {
      text-align: center;
      font-size: 18px;
      margin-top: 20px;
    }
    .loading { color: #007bff; }
    .error { color: red; }
    button {
      display: block;
      margin: 0 auto;
      padding: 10px 20px;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>🛒 Fake E-Commerce Store</h1>
  <button id="loadBtn">Load Products</button>
  <div id="status" class="status"></div>
  <div id="products"></div>

  <script>
    const statusDiv = document.getElementById("status");
    const productsDiv = document.getElementById("products");
    const loadBtn = document.getElementById("loadBtn");

    // Fake API function
    const fetchProducts = async () => {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          Math.random() < 0.2
            ? reject("❌ Failed to fetch products. Try again!")
            : resolve([
                { id: 1, name: "Laptop", price: 1200 },
                { id: 2, name: "Smartphone", price: 800 },
                { id: 3, name: "Headphones", price: 150 },
                { id: 4, name: "Smartwatch", price: 250 },
                { id: 5, name: "Tablet", price: 600 }
              ]);
        }, 1500); // shorter delay for efficiency
      });
    };

    // Render products efficiently
    const renderProducts = (products) => {
      productsDiv.innerHTML = products
        .map(p => `
          <div class="product">
            <h3>${p.name}</h3>
            <p>Price: $${p.price}</p>
          </div>
        `)
        .join("");
    };

    // Display products with async/await
    const displayProducts = async () => {
      statusDiv.textContent = "⏳ Loading products...";
      statusDiv.className = "status loading";
      productsDiv.innerHTML = "";

      try {
        const products = await fetchProducts();
        statusDiv.textContent = "✅ Products loaded!";
        statusDiv.className = "status loading";
        renderProducts(products);
      } catch (error) {
        statusDiv.textContent = error;
        statusDiv.className = "status error";
      }
    };

    // Attach event once
    loadBtn.addEventListener("click", displayProducts);
  </script>
</body>
</html>
